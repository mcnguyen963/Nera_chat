<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roleplay Chat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Login gate -->
  <div id="login-screen" class="login-screen hidden">
    <form id="login-form" class="login-card">
      <h1>Roleplay Chat</h1>
      <p class="muted" id="login-note"></p>
      <label>Email (Firebase Auth user)
        <input type="text" id="login-username" autocomplete="username" required />
      </label>
      <label>Password
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <div id="login-error" class="error-text"></div>
      <button type="submit" class="btn primary">Log in</button>
    </form>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span>Sessions</span>
        <button id="btn-new-session" class="btn small" title="New session">+ New</button>
      </div>
      <ul id="session-list" class="session-list"></ul>
      <div class="sidebar-footer">
        <button id="btn-logout" class="btn small">Log out</button>
      </div>
    </aside>

    <main class="main">
      <nav class="tab-bar">
        <button class="tab active" data-tab="chat">Chat</button>
        <button class="tab" data-tab="settings">Settings</button>
      </nav>

      <!-- Chat tab -->
      <section id="chat-tab" class="chat-tab">
        <div class="chat-toolbar">
          <div id="context-indicator" class="context-indicator" title="Tokens that would be sent next turn / context budget">
            <div class="context-bar"><div id="context-fill" class="context-fill"></div><div id="context-threshold" class="context-threshold"></div></div>
            <span id="context-label" class="muted">—</span>
          </div>
          <button id="btn-summarize" class="btn small">Summarize</button>
        </div>
        <div id="message-list" class="message-list"></div>
        <form id="composer" class="composer">
          <textarea id="chat-input" placeholder="Write your turn… (Enter to send, Shift+Enter for newline)" rows="2"></textarea>
          <button type="submit" id="btn-send" class="btn primary">Send</button>
        </form>
      </section>

      <!-- Settings tab -->
      <section id="settings-tab" class="settings-tab hidden">
        <h2>Connection</h2>
        <div class="settings-grid">
          <label>Endpoint URL
            <input type="text" id="set-endpoint" placeholder="https://openrouter.ai/api/v1/chat/completions" />
          </label>
          <label>API key
            <input type="password" id="set-apikey" autocomplete="off" />
          </label>
          <label>Model ID
            <input type="text" id="set-model" placeholder="e.g. anthropic/claude-3.5-sonnet" />
          </label>
          <label>Max response tokens (max_tokens)
            <input type="number" id="set-max-resp" min="1" />
          </label>
          <label class="checkbox-label"><input type="checkbox" id="set-streaming" /> Streaming</label>
        </div>

        <h3>Reasoning / thinking</h3>
        <div class="settings-grid">
          <label class="checkbox-label"><input type="checkbox" id="set-reasoning-enabled" /> Enabled</label>
          <label>Mode
            <select id="set-reasoning-mode">
              <option value="effort">effort</option>
              <option value="max_tokens">max_tokens</option>
            </select>
          </label>
          <label>Effort (used when mode = effort)
            <select id="set-reasoning-effort">
              <option value="none">none</option>
              <option value="minimal">minimal</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
            </select>
          </label>
          <label>Reasoning max_tokens (mode = max_tokens)
            <input type="number" id="set-reasoning-maxtokens" min="1" />
          </label>
        </div>

        <h2>Context &amp; Summarization</h2>
        <div class="settings-grid">
          <label>Max context tokens (total budget)
            <input type="number" id="set-max-context" min="256" />
          </label>
          <label>Auto-summary threshold (%)
            <input type="number" id="set-auto-threshold" min="1" max="100" />
          </label>
          <label>Keep recent messages after summary
            <input type="number" id="set-keep-n" min="0" />
          </label>
        </div>

        <h2>Prompts (global)</h2>
        <div class="settings-prompts">
          <label>Narrator system prompt
            <textarea id="set-narrator-prompt" rows="8"></textarea>
          </label>
          <label>Summarizer system prompt
            <textarea id="set-summarizer-prompt" rows="8"></textarea>
          </label>
        </div>
        <div class="settings-actions">
          <button id="btn-save-settings" class="btn primary">Save settings</button>
          <span id="settings-saved-msg" class="muted"></span>
        </div>

        <h2>This Session</h2>
        <div class="settings-grid">
          <label>Title
            <input type="text" id="set-session-title" />
          </label>
        </div>
        <label class="full-label">Long-term plan (hidden from chat view; the model can update it via &lt;plan&gt;…&lt;/plan&gt;)
          <textarea id="set-session-plan" rows="6"></textarea>
        </label>
        <div class="settings-actions">
          <button id="btn-save-session" class="btn primary">Save session</button>
        </div>

        <h2>Import / Export (SillyTavern JSONL)</h2>
        <div class="settings-actions">
          <input type="file" id="file-import-st" accept=".jsonl,application/jsonl" class="hidden" />
          <button id="btn-import-st" class="btn">Import .jsonl (creates new session)</button>
          <button id="btn-export-st" class="btn">Export current session</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
