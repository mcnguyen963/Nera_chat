name: Deploy to GitHub Pages

on:
  push:
    branches: [Release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generate js/firebase-config.js before publishing to GitHub Pages.
      - name: Write firebase-config.js
        run: |
          cat > js/firebase-config.js <<'EOF'
          export const firebaseConfig = {
            apiKey: "AIzaSyBIdIDMi24w5kYo-i5fHlRIh-EjGmbXa54",
            authDomain: "aichat-95df4.firebaseapp.com",
            projectId: "aichat-95df4",
            storageBucket: "aichat-95df4.firebasestorage.app",
            messagingSenderId: "225600392302",
            appId: "1:225600392302:web:1b2577ba2e0147e778aa7f",
            measurementId: "G-440MGBS4HF"
          };
          EOF

      - name: List built-in pets
        run: python3 scripts/generate-pet-manifest.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
