name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Placeholder Firebase config for static analysis
        run: cp js/firebase-config.example.js js/firebase-config.js
      - run: npm run check:syntax
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:qc

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_BROWSER: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20'
            coverage: false
          - node: '24'
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ matrix.coverage && 'npm' || '' }}
      - name: Syntax on oldest Node
        if: ${{ !matrix.coverage }}
        run: node scripts/check-syntax.mjs
      - name: Regression suite
        if: ${{ !matrix.coverage }}
        run: node scripts/test-rerun.mjs
      - name: Install QC tooling
        if: ${{ matrix.coverage }}
        run: npm ci --ignore-scripts
      - name: Regression suite with coverage ratchet
        if: ${{ matrix.coverage }}
        run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage
            !coverage/raw
            !coverage/v8
          retention-days: 14
          if-no-files-found: ignore

  build:
    if: github.ref == 'refs/heads/main'
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Generate js/firebase-config.js before publishing to GitHub Pages.
      - name: Write firebase-config.js
        run: |
          cat > js/firebase-config.js <<'EOF'
          export const firebaseConfig = {
            apiKey: "AIzaSyBIdIDMi24w5kYo-i5fHlRIh-EjGmbXa54",
            authDomain: "aichat-95df4.firebaseapp.com",
            projectId: "aichat-95df4",
            storageBucket: "aichat-95df4.firebasestorage.app",
            messagingSenderId: "225600392302",
            appId: "1:225600392302:web:1b2577ba2e0147e778aa7f",
            measurementId: "G-440MGBS4HF"
          };
          EOF

      - name: Check public pet assets
        run: python3 scripts/check-public-resources.py

      - name: Generate pet catalog
        run: python3 scripts/generate-pet-manifest.py

      - name: Assemble site (app files only)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p "_site/system prompts"
          cp index.html _site/
          cp -R css js resources _site/
          cp "system prompts/"*.md "_site/system prompts/"
          rm -f "_site/system prompts/README.md"
          rm -f _site/js/firebase-config.example.js
          find _site -name '*.d.ts' -type f -delete
          find _site \( -name '*:Zone.Identifier' -o -name '.DS_Store' \) -type f -delete
          test -s _site/js/firebase-config.js
          test -s _site/js/vendor/gpt-tokenizer-2.9.0.js
          test -s "_site/system prompts/rewrite.md"
          test -s _site/resources/pets/manifest.json
          test -z "$(find _site -name '*.d.ts' -print -quit)"
          for f in $(grep -o '"[A-Za-z0-9-]*\.md"' js/system-prompts.js | tr -d '"'); do
            test -s "_site/system prompts/$f"
          done
          for p in lorebooks play-history investigate data docs starting production-reports production-backups tests scripts private .private .secret memory.md opencode.json REVIEW_FINDINGS.md improvePlan.md firebase.json firestore.rules RELEASE.md register.html package.json package-lock.json node_modules eslint.config.js eslint-suppressions.json jsconfig.json types coverage; do
            test ! -e "_site/$p"
          done

      - name: Stamp every module and stylesheet with the release version
        run: node scripts/stamp-version.mjs _site "$GITHUB_SHA"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
