name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regression suite
        run: node --experimental-vm-modules --test tests/*.mjs

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Generate js/firebase-config.js before publishing to GitHub Pages.
      - name: Write firebase-config.js
        run: |
          cat > js/firebase-config.js <<'EOF'
          export const firebaseConfig = {
            apiKey: "AIzaSyBIdIDMi24w5kYo-i5fHlRIh-EjGmbXa54",
            authDomain: "aichat-95df4.firebaseapp.com",
            projectId: "aichat-95df4",
            storageBucket: "aichat-95df4.firebasestorage.app",
            messagingSenderId: "225600392302",
            appId: "1:225600392302:web:1b2577ba2e0147e778aa7f",
            measurementId: "G-440MGBS4HF"
          };
          EOF

      - name: Assemble site (app files only)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p "_site/system prompts"
          cp index.html _site/
          cp -R css js resources _site/
          cp "system prompts/"*.md "_site/system prompts/"
          rm -f "_site/system prompts/README.md"
          rm -f _site/js/firebase-config.example.js
          find _site \( -name '*:Zone.Identifier' -o -name '.DS_Store' \) -type f -delete
          test -s _site/js/firebase-config.js
          test -s _site/js/vendor/gpt-tokenizer-2.9.0.js
          test -s "_site/system prompts/rewrite.md"
          test -s _site/resources/pets/manifest.json
          for f in $(grep -o '"[A-Za-z0-9-]*\.md"' js/system-prompts.js | tr -d '"'); do
            test -s "_site/system prompts/$f"
          done
          for p in investigate docs starting tests scripts private memory.md opencode.json REVIEW_FINDINGS.md improvePlan.md; do
            test ! -e "_site/$p"
          done

      - name: Stamp every module and stylesheet with the release version
        run: node scripts/stamp-version.mjs _site "$GITHUB_SHA"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
